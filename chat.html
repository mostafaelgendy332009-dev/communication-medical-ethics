<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TeamSpace | شات الفريق</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="chat-addon.css">
</head>
<body>
  <main class="chat-page">
    <header class="top"><a href="./">✚ TeamSpace</a><span id="who">جارٍ الاتصال...</span></header>
    <section class="chat-card">
      <div class="heading"><div><small>COMMUNICATION & MEDICAL ETHICS</small><h1>💬 دردشة الفريق</h1><p>رسائل فورية بين أعضاء الجروب</p></div><a class="back" href="./">العودة للمنصة ←</a></div>
      <div id="status" class="status">جارٍ تحميل المحادثة...</div>
      <div id="messages" class="messages" aria-live="polite"><p class="empty">أهلًا بيكم! ابدأوا المحادثة.</p></div>
      <form id="form" class="composer"><textarea id="input" maxlength="1000" rows="2" placeholder="اكتب رسالتك للفريق..." required></textarea><button id="send" type="submit">إرسال ➤</button></form>
      <p class="note">استخدموا الشات للتنسيق وتبادل ما يساعد الفريق، مع الحفاظ على الاحترام.</p>
    </section>
  </main>
  <script type="module" src="chat-addon.js"></script>
</body></html>
